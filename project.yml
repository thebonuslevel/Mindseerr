name: Oppresseerr
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Oppresseerr:
    type: application
    platform: tvOS
    sources:
      - Oppresseerr
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Oppresseerr
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: Oppresseerr connects to your media request server on your local network.
        TraktClientID: "$(TRAKT_CLIENT_ID)"
        TraktClientSecret: "$(TRAKT_CLIENT_SECRET)"
        TraktRedirectURI: "$(TRAKT_REDIRECT_URI)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.oppresseerr
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        DEVELOPMENT_TEAM: ""
        # Trakt app for watchlist sign-in. Create one at developer.trakt.tv/apps/new
        # (redirect URI: urn:ietf:wg:oauth:2.0:oob or any https:// address you own), paste its
        # Client ID here, then run xcodegen generate.
        TRAKT_CLIENT_ID: "SoUmZkNgABLO5Q4uiPCByzKoCuvRKfI6r8YbrHHUDVY"
        # Leave empty: Trakt no longer issues Client Secrets to new apps. Only older apps that have one need it.
        TRAKT_CLIENT_SECRET: ""
        # Must match the Redirect URI on your Trakt app (only used when renewing the sign-in).
        TRAKT_REDIRECT_URI: "urn:ietf:wg:oauth:2.0:oob"
